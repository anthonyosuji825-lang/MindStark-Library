<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="logo.png"/>
  <title>My Event Requests — MindStark</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --arena-bg:     #0e0a06;
      --arena-surface:#1a1108;
      --arena-card:   #211609;
      --arena-border: rgba(200,150,62,.15);
      --arena-border-bright: rgba(200,150,62,.4);
      --arena-text:   rgba(245,240,232,.92);
      --arena-muted:  rgba(245,240,232,.42);
      --gold:         #c8963e;
      --success:      #4caf7d;
      --danger:       #e05c5c;
      --cream:        #f5f0e8;
      --brown:        #3b2a1a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--arena-bg);
      color: var(--arena-text);
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(200,150,62,.07) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    nav {
      position: sticky; top: 0; z-index: 200;
      background: rgba(14,10,6,.92); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--arena-border);
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem; max-width: 800px; margin: 0 auto;
    }
    .logo { display: flex; flex-direction: column; line-height: 1; text-decoration: none; }
    .logo-main { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; color: var(--cream); }
    .logo-sub { font-size: .6rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
    .nav-back { font-size: .82rem; color: var(--arena-muted); text-decoration: none; transition: color .2s; }
    .nav-back:hover { color: var(--gold); }

    .wrap {
      position: relative; z-index: 1;
      max-width: 800px; margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    .page-header { margin-bottom: 2.5rem; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: .6rem;
      font-size: .7rem; letter-spacing: .22em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 1rem;
    }
    .eyebrow::before, .eyebrow::after {
      content: ''; display: block; width: 24px; height: 1px; background: var(--gold); opacity: .5;
    }
    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem; font-weight: 900; color: var(--cream); margin-bottom: .4rem;
    }
    .page-header p { font-size: .88rem; color: var(--arena-muted); }

    /* Request cards */
    .requests-list { display: flex; flex-direction: column; gap: 1rem; }

    .req-card {
      background: var(--arena-card);
      border: 1px solid var(--arena-border);
      border-radius: 14px; overflow: hidden;
      transition: border-color .2s;
    }
    .req-card.approved { border-color: rgba(76,175,125,.3); }
    .req-card.rejected { border-color: rgba(224,92,92,.2); }
    .req-card.new-status { border-color: var(--gold); }

    .req-card-header {
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--arena-border);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
    }
    .req-title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem; font-weight: 700; color: var(--cream);
      margin-bottom: .2rem;
    }
    .req-date { font-size: .72rem; color: var(--arena-muted); }

    .status-pill {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .25rem .75rem; border-radius: 50px;
      font-size: .72rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; border: 1px solid; flex-shrink: 0;
    }
    .status-pill.pending  { color: var(--gold); border-color: rgba(200,150,62,.4); background: rgba(200,150,62,.08); }
    .status-pill.approved { color: var(--success); border-color: rgba(76,175,125,.4); background: rgba(76,175,125,.08); }
    .status-pill.rejected { color: var(--danger); border-color: rgba(224,92,92,.4); background: rgba(224,92,92,.08); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .req-card-body { padding: 1.1rem 1.4rem; }
    .req-topic { font-size: .88rem; color: var(--arena-muted); line-height: 1.6; margin-bottom: .85rem; }

    .req-meta {
      display: flex; gap: .75rem; flex-wrap: wrap;
      font-size: .78rem; color: var(--arena-muted);
    }
    .req-meta span { display: flex; align-items: center; gap: .3rem; }
    .req-meta strong { color: var(--arena-text); }

    /* Status messages */
    .status-message {
      margin-top: .85rem; padding: .75rem 1rem;
      border-radius: 8px; font-size: .84rem; line-height: 1.5;
    }
    .status-message.approved {
      background: rgba(76,175,125,.08);
      border: 1px solid rgba(76,175,125,.25);
      color: var(--success);
    }
    .status-message.rejected {
      background: rgba(224,92,92,.08);
      border: 1px solid rgba(224,92,92,.2);
      color: var(--danger);
    }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 4rem 2rem;
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1.25rem; opacity: .4; }
    .empty-state h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem; color: var(--cream); margin-bottom: .6rem;
    }
    .empty-state p { font-size: .88rem; color: var(--arena-muted); margin-bottom: 1.5rem; }
    .empty-state a {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .75rem 1.5rem; border-radius: 10px;
      background: var(--gold); color: var(--brown);
      text-decoration: none; font-weight: 700; font-size: .88rem;
      transition: all .2s;
    }
    .empty-state a:hover { background: var(--cream); }

    /* Not signed in */
    .signin-wall {
      text-align: center; padding: 4rem 2rem;
    }
    .signin-wall .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .signin-wall h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem; color: var(--cream); margin-bottom: .5rem;
    }
    .signin-wall p { font-size: .88rem; color: var(--arena-muted); margin-bottom: 1.5rem; }
    .signin-btn {
      display: inline-block; padding: .85rem 1.75rem;
      background: var(--gold); color: var(--brown);
      border-radius: 10px; text-decoration: none;
      font-weight: 700; font-size: .92rem; transition: all .2s;
    }
    .signin-btn:hover { background: var(--cream); }

    /* New badge */
    .new-badge {
      display: inline-block;
      background: var(--danger); color: #fff;
      font-size: .6rem; font-weight: 800; letter-spacing: .08em;
      text-transform: uppercase; padding: .15rem .45rem;
      border-radius: 50px; margin-left: .5rem;
      vertical-align: middle;
    }

    /* Propose button */
    .propose-btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .65rem 1.25rem; border-radius: 8px;
      background: rgba(200,150,62,.1); color: var(--gold);
      border: 1px solid var(--arena-border-bright);
      text-decoration: none; font-size: .84rem; font-weight: 600;
      transition: all .2s;
    }
    .propose-btn:hover { background: rgba(200,150,62,.18); }

    @media (max-width: 540px) {
      .wrap { padding: 2rem 1rem 4rem; }
      .nav-inner { padding: .9rem 1rem; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a class="logo" href="index.html">
        <span class="logo-main">MindStark</span>
        <span class="logo-sub">My Requests</span>
      </a>
      <a class="nav-back" href="arena.html">← Arena</a>
    </div>
  </nav>

  <div class="wrap">
    <div class="page-header">
      <div class="eyebrow">Arena</div>
      <h1>My Event Requests</h1>
      <p>Track the status of events you've proposed to MindStark.</p>
    </div>

    <div id="content">
      <div style="text-align:center;padding:3rem;color:var(--arena-muted);font-size:.88rem;">Loading…</div>
    </div>
  </div>

  <script src="supabase.js"></script>
  <script>
    const TONY_ID = '429025f0-a2b5-41ec-a292-29e8a2241690';

    function fmtDate(d) {
      return new Date(d).toLocaleDateString('en-NG', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function esc(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function statusPill(status) {
      const dot = `<span class="status-dot"></span>`;
      return `<span class="status-pill ${status}">${dot} ${status.charAt(0).toUpperCase() + status.slice(1)}</span>`;
    }

    function statusMessage(status) {
      if (status === 'approved') {
        return `<div class="status-message approved">🎉 Your event was approved! MindStark will organize it soon. Keep an eye on the Arena and Events page.</div>`;
      }
      if (status === 'rejected') {
        return `<div class="status-message rejected">Your request wasn't selected this time. Don't be discouraged — keep proposing ideas. MindStark reviews all submissions.</div>`;
      }
      return '';
    }

    async function markAsSeen(ids) {
      if (!ids.length) return;
      await window._sb
        .from('event_requests')
        .update({ seen_by_user: true })
        .in('id', ids);
    }

    async function loadRequests(user) {
      const content = document.getElementById('content');

      const { data, error } = await window._sb
        .from('event_requests')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });

      if (error || !data?.length) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <h2>No Requests Yet</h2>
            <p>You haven't proposed any events yet. Have an idea? Share it with MindStark.</p>
            <a href="arena-request.html">➕ Propose an Event</a>
          </div>`;
        return;
      }

      // Mark unseen approved/rejected as seen
      const unseenIds = data
        .filter(r => !r.seen_by_user && r.status !== 'pending')
        .map(r => r.id);
      if (unseenIds.length) await markAsSeen(unseenIds);

      const typeIcons = { gauntlet: '⚔️', grand_hall: '🏛', hot_seat: '🎤', tournament: '🏆' };

      content.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
          <p style="font-size:.82rem;color:var(--arena-muted);">${data.length} request${data.length === 1 ? '' : 's'}</p>
          <a class="propose-btn" href="arena-request.html">➕ Propose Another</a>
        </div>
        <div class="requests-list">
          ${data.map(r => {
            const isNew = !r.seen_by_user && r.status !== 'pending';
            return `
              <div class="req-card ${r.status}${isNew ? ' new-status' : ''}">
                <div class="req-card-header">
                  <div>
                    <div class="req-title">
                      ${esc(r.event_title)}
                      ${isNew ? '<span class="new-badge">New</span>' : ''}
                    </div>
                    <div class="req-date">Submitted ${fmtDate(r.created_at)}</div>
                  </div>
                  ${statusPill(r.status)}
                </div>
                <div class="req-card-body">
                  <div class="req-topic">${esc(r.event_topic)}</div>
                  <div class="req-meta">
                    <span>💰 Entry: <strong>${r.entry_fee > 0 ? r.entry_fee + 'tr' : 'Free'}</strong></span>
                    <span>🏆 Prize: <strong>${r.prize_pool > 0 ? r.prize_pool + 'tr' : '—'}</strong></span>
                    ${r.notes ? `<span>📝 Has notes</span>` : ''}
                  </div>
                  ${statusMessage(r.status)}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

      // Realtime — listen for status changes
      window._sb
        .channel('my-requests')
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'event_requests',
          filter: `user_id=eq.${user.id}`
        }, () => {
          loadRequests(user);
        })
        .subscribe();
    }

    document.addEventListener('supabase:ready', async () => {
      const content = document.getElementById('content');
      let user = null;

      try {
        const res = await window._sb.auth.getUser();
        user = res.data?.user || null;
        if (!user) {
          await new Promise(r => setTimeout(r, 800));
          const retry = await window._sb.auth.getUser();
          user = retry.data?.user || null;
        }
      } catch(e) { user = null; }

      if (!user) {
        content.innerHTML = `
          <div class="signin-wall">
            <div class="icon">🔐</div>
            <h2>Sign In Required</h2>
            <p>Sign in to view your event requests.</p>
            <a class="signin-btn" href="signin.html">Sign In</a>
          </div>`;
        return;
      }

      await loadRequests(user);
    });

    if (window._sb) {
      window._sb.auth.getUser().then(async ({ data: { user } }) => {
        if (user) await loadRequests(user);
      });
    }
  </script>
</body>
</html>
