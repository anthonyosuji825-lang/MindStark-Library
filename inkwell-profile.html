<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="logo.png"/>
<meta property="og:title" content="MindStark Inkwell"/>
<meta property="og:description" content="Writer profiles on MindStark Inkwell."/>
<title>Writer Profile — MindStark Inkwell</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── VARIABLES ─────────────────────────────────────────────── */
:root {
  --cream: #f5f0e8;
  --warm: #ede5d5;
  --warm2: #e4d9c4;
  --brown: #3b2a1a;
  --gold: #c8963e;
  --rust: #a0522d;
  --text: #2c1e0f;
  --muted: #7a6652;
  --white: #ffffff;
  --border: rgba(200,150,62,.18);
  --border-bright: rgba(200,150,62,.38);
  --shadow: 0 4px 32px rgba(59,42,26,.1);
  --card-bg: #ffffff;
  --surface: #faf6ef;

  /* Dark mode variables */
  --ink-bg: #0d0905;
  --ink-surface: #17100a;
  --ink-card: #1e1510;
  --ink-border: rgba(200,150,62,.14);
  --ink-border-bright: rgba(200,150,62,.38);
  --ink-text: rgba(245,240,232,.92);
  --ink-muted: rgba(245,240,232,.42);
}

/* ── DARK MODE ──────────────────────────────────────────────── */
body.dark-mode {
  --cream: #0d0905;
  --warm: #17100a;
  --warm2: #1e1510;
  --brown: #f5f0e8;
  --gold: #c8963e;
  --text: rgba(245,240,232,.92);
  --muted: rgba(245,240,232,.42);
  --border: rgba(200,150,62,.14);
  --border-bright: rgba(200,150,62,.38);
  --card-bg: #1e1510;
  --surface: #17100a;
  --shadow: 0 4px 32px rgba(0,0,0,.3);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; overflow-x: hidden; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

/* ── AMBIENT BACKGROUND ─────────────────────────────────────── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 45% at 60% 0%, rgba(200,150,62,.09) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 5% 80%, rgba(160,82,45,.06) 0%, transparent 55%);
  pointer-events: none; z-index: 0;
}

/* ── NAVBAR ─────────────────────────────────────────────────── */
nav {
  position: sticky; top: 0; z-index: 200;
  background: rgba(245,240,232,.95);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  transition: background .3s;
}
body.dark-mode nav { background: rgba(13,9,5,.94); }
.nav-inner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.1rem 2rem; max-width: 1280px; margin: 0 auto;
  gap: .75rem;
}
.logo { display: flex; flex-direction: column; line-height: 1; text-decoration: none; flex-shrink: 0; }
.logo-main { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: var(--brown); }
.logo-sub { font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.nav-links { display: flex; gap: 2rem; list-style: none; }
.nav-links a { text-decoration: none; color: var(--muted); font-size: .9rem; font-weight: 500; transition: color .2s; }
.nav-links a:hover, .nav-links a.active { color: var(--gold); }
.nav-right {
  display: flex; align-items: center; gap: .85rem;
  flex-shrink: 0; min-width: 0;
}
.nav-user {
  display: none; align-items: center; gap: .55rem;
  font-size: .82rem; color: var(--muted); font-weight: 500;
  overflow: hidden;
}
.nav-user-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
#nav-username { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }

/* Dark mode toggle */
.dark-toggle {
  width: 36px; height: 20px; border-radius: 10px;
  background: var(--border-bright); border: none; cursor: pointer;
  position: relative; transition: background .3s; flex-shrink: 0;
  padding: 0;
}
.dark-toggle::after {
  content: '';
  position: absolute; top: 3px; left: 3px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--gold);
  transition: transform .3s;
}
body.dark-mode .dark-toggle::after { transform: translateX(16px); }

.nav-cta {
  background: var(--brown); color: var(--cream);
  padding: .5rem 1.25rem; border-radius: 50px;
  font-size: .88rem; font-weight: 500; text-decoration: none;
  transition: background .2s; display: inline-block;
}
.nav-cta:hover { background: var(--gold); }
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: .4rem; background: none; border: none; z-index: 300; }
.hamburger span { display: block; width: 24px; height: 2px; background: var(--brown); border-radius: 2px; transition: all .3s; }
body.dark-mode .hamburger span { background: var(--cream); }
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ── MOBILE BOTTOM SHEET NAV ────────────────────────────────── */
.mobile-sheet-overlay {
  display: none; position: fixed; inset: 0; z-index: 150;
  background: rgba(59,42,26,.45); backdrop-filter: blur(3px);
}
.mobile-sheet-overlay.open { display: block; }
.mobile-sheet {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 151;
  background: var(--cream);
  border-top: 1px solid var(--border-bright);
  border-radius: 20px 20px 0 0;
  padding: 1rem 1.75rem 2.5rem;
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.4,0,.2,1);
}
body.dark-mode .mobile-sheet { background: var(--ink-card); }
.mobile-sheet.open { transform: translateY(0); }
.sheet-handle { width: 40px; height: 4px; background: var(--border-bright); border-radius: 2px; margin: 0 auto 1.5rem; }
.mobile-sheet a {
  display: block; font-family: 'Playfair Display', serif;
  font-size: 1.3rem; font-weight: 700; color: var(--brown);
  text-decoration: none; padding: .7rem 0;
  border-bottom: 1px solid var(--border); transition: color .2s;
}
.mobile-sheet a:hover { color: var(--gold); }
.mobile-sheet a:last-child { border-bottom: none; }
.mobile-sheet .mob-cta {
  display: block; text-align: center;
  background: var(--brown); color: var(--cream);
  border-radius: 50px; padding: .85rem; margin-top: 1.25rem;
  font-family: 'DM Sans', sans-serif; font-size: .95rem; font-weight: 500;
  text-decoration: none; transition: background .2s;
}
.mobile-sheet .mob-cta:hover { background: var(--gold); color: var(--white); }

/* ── PAGE WRAP ──────────────────────────────────────────────── */
.page-wrap {
  position: relative; z-index: 1;
  max-width: 1280px; margin: 0 auto;
  padding: 0 2.5rem 6rem;
  overflow-x: hidden;
}

/* ── HERO ───────────────────────────────────────────────────── */
.inkwell-hero {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 4rem; align-items: center;
  padding: 6rem 0 5rem;
  min-height: 72vh;
}
.hero-eyebrow {
  display: flex; align-items: center; gap: .75rem;
  margin-bottom: 1.5rem;
}
.hero-eyebrow::before { content: ''; display: block; width: 36px; height: 2px; background: var(--gold); }
.hero-eyebrow span { font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.hero-text h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.6rem, 5vw, 4rem);
  font-weight: 900; line-height: 1.1;
  color: var(--brown); margin-bottom: 1.25rem;
}
.hero-text h1 em { font-style: italic; color: var(--gold); }
.hero-text p {
  font-size: 1.08rem; color: var(--muted);
  max-width: 480px; margin-bottom: 2.75rem; line-height: 1.85;
}
.hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; }
.btn-primary {
  background: var(--brown); color: var(--cream);
  padding: .88rem 2rem; border-radius: 50px;
  font-family: 'DM Sans', sans-serif; font-size: .95rem; font-weight: 500;
  border: none; cursor: pointer; transition: all .25s; display: inline-block; text-decoration: none;
}
.btn-primary:hover { background: var(--gold); transform: translateY(-2px); }
.btn-secondary {
  background: transparent; color: var(--brown);
  padding: .88rem 2rem; border-radius: 50px;
  font-family: 'DM Sans', sans-serif; font-size: .95rem; font-weight: 500;
  border: 2px solid var(--brown); cursor: pointer; transition: all .25s;
  display: inline-block; text-decoration: none;
}
.btn-secondary:hover { background: var(--brown); color: var(--cream); transform: translateY(-2px); }

/* ── HERO VISUAL ────────────────────────────────────────────── */
.hero-visual {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}
.hero-badges {
  display: flex;
  gap: .75rem;
  flex-wrap: wrap;
  justify-content: center;
}
.quill-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 2.25rem;
  width: 100%; max-width: 400px;
  box-shadow: var(--shadow);
  position: relative;
}
.quill-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  border-radius: 24px 24px 0 0;
}
.qc-label {
  font-size: .68rem; letter-spacing: .18em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 1rem; font-weight: 600;
}
.qc-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem; font-weight: 900; color: var(--brown);
  margin-bottom: .4rem; line-height: 1.3;
}
.qc-author { font-size: .78rem; color: var(--muted); margin-bottom: 1.25rem; }
.qc-excerpt {
  font-family: 'Playfair Display', serif;
  font-size: .88rem; color: var(--muted); line-height: 1.75;
  font-style: italic; border-left: 2px solid var(--gold);
  padding-left: .85rem; margin-bottom: 1.25rem;
}
.qc-meta { display: flex; align-items: center; justify-content: space-between; }
.qc-stats { display: flex; gap: .85rem; }
.qc-stat { font-size: .75rem; color: var(--muted); display: flex; align-items: center; gap: .3rem; }
.qc-genre {
  font-size: .65rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--gold); background: rgba(200,150,62,.1);
  border: 1px solid var(--border); padding: .25rem .7rem; border-radius: 50px;
}

/* floating badges */
.hero-badge {
  background: var(--brown); color: var(--cream);
  border-radius: 14px; padding: .65rem .9rem;
  font-size: .72rem; font-weight: 600; box-shadow: var(--shadow);
  white-space: nowrap;
}
.hero-badge.b2 { color: var(--brown); background: var(--warm2); border: 1px solid var(--border); }
.hero-badge span { color: var(--gold); }

/* ── STATS BAR ──────────────────────────────────────────────── */
.stats-bar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--brown); border-radius: 20px;
  overflow: hidden; margin-bottom: 4.5rem;
}
.stat-item {
  padding: 2.25rem 1.5rem; text-align: center;
  border-right: 1px solid rgba(245,240,232,.08);
}
.stat-item:last-child { border-right: none; }
.stat-num {
  display: block; font-family: 'Playfair Display', serif;
  font-size: 2.25rem; font-weight: 900; color: var(--gold); line-height: 1;
}
.stat-lbl {
  display: block; font-size: .72rem; text-transform: uppercase;
  letter-spacing: .14em; color: rgba(245,240,232,.45); margin-top: .5rem;
}

/* ── MAIN GRID ──────────────────────────────────────────────── */
.inkwell-grid {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 2.5rem; align-items: start;
}

/* ── SECTION HEAD ───────────────────────────────────────────── */
.section-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
.section-eyebrow { font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: .3rem; }
.section-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; color: var(--brown); }
.see-all { font-size: .8rem; color: var(--gold); text-decoration: none; font-weight: 500; transition: opacity .2s; padding-bottom: .25rem; }
.see-all:hover { opacity: .7; }

/* ── STORY CARDS ────────────────────────────────────────────── */
.trending-section { margin-bottom: 3.5rem; }
.story-list { display: flex; flex-direction: column; gap: .75rem; }
.story-item {
  display: flex; align-items: center; gap: 1rem;
  padding: 1rem 1.25rem;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  text-decoration: none; color: inherit;
  transition: border-color .25s, transform .25s, box-shadow .25s;
}
.story-item:hover {
  border-color: var(--border-bright);
  transform: translateX(5px);
  box-shadow: var(--shadow);
}
.story-rank {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem; font-weight: 900;
  color: rgba(200,150,62,.2); min-width: 28px; text-align: center; line-height: 1;
}
.story-cover {
  width: 48px; height: 64px; border-radius: 6px 10px 10px 6px;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  writing-mode: vertical-rl; font-size: .48rem; font-weight: 700;
  color: rgba(255,255,255,.7); font-family: 'Playfair Display', serif;
  text-align: center; padding: .3rem; box-shadow: 3px 3px 12px rgba(59,42,26,.18);
}
.story-info { flex: 1; min-width: 0; }
.story-genre { font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: .2rem; }
.story-title {
  font-family: 'Playfair Display', serif;
  font-size: .95rem; font-weight: 700; color: var(--brown);
  margin-bottom: .2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.story-author { font-size: .75rem; color: var(--muted); }
.story-meta { display: flex; flex-direction: column; align-items: flex-end; gap: .3rem; flex-shrink: 0; }
.story-reads { font-size: .72rem; color: var(--muted); font-family: 'DM Mono', monospace; }
.story-likes { font-size: .72rem; color: var(--gold); }

/* ── COMMUNITY FEED ─────────────────────────────────────────── */
.feed-section { margin-bottom: 3.5rem; }
.feed-list { display: flex; flex-direction: column; gap: .75rem; }
.feed-item {
  padding: 1.1rem 1.25rem;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  transition: border-color .2s, box-shadow .2s;
}
.feed-item:hover { border-color: var(--border-bright); box-shadow: var(--shadow); }
.feed-top { display: flex; align-items: center; gap: .65rem; margin-bottom: .6rem; }
.feed-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--warm2); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: .7rem; font-weight: 700; color: var(--gold);
  text-transform: uppercase; flex-shrink: 0;
}
.feed-author { font-size: .82rem; color: var(--brown); font-weight: 600; }
.feed-action { font-size: .82rem; color: var(--muted); }
.feed-time { font-size: .72rem; color: var(--muted); margin-left: auto; font-family: 'DM Mono', monospace; }
.feed-content {
  font-family: 'Playfair Display', serif;
  font-size: .92rem; color: var(--text); line-height: 1.5;
}
.feed-content span { color: var(--rust); font-style: italic; }
.feed-tag {
  display: inline-block; margin-top: .6rem;
  font-size: .65rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--gold); background: rgba(200,150,62,.08);
  border: 1px solid var(--border); padding: .2rem .65rem; border-radius: 50px;
}

/* ── SIDEBAR ────────────────────────────────────────────────── */
.sidebar {
  display: flex; flex-direction: column; gap: 1.5rem;
  position: sticky; top: 5rem;
}

/* Featured Writer */
.featured-writer {
  background: var(--brown);
  border-radius: 20px; padding: 2rem;
  text-align: center; position: relative; overflow: hidden;
}
.featured-writer::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.featured-writer::after {
  content: '';
  position: absolute; bottom: -40px; right: -40px;
  width: 120px; height: 120px; border-radius: 50%;
  background: rgba(200,150,62,.06);
}
.fw-label { font-size: .65rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.1rem; }
.fw-avatar {
  width: 68px; height: 68px; border-radius: 50%;
  background: rgba(200,150,62,.15); border: 2px solid var(--gold);
  margin: 0 auto .85rem;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Playfair Display', serif; font-size: 1.5rem;
  font-weight: 900; color: var(--gold);
}
.fw-name { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 900; color: var(--cream); margin-bottom: .25rem; }
.fw-type { font-size: .75rem; color: var(--gold); margin-bottom: .6rem; }
.fw-bio { font-size: .8rem; color: rgba(245,240,232,.5); line-height: 1.65; margin-bottom: 1.1rem; }
.fw-stats { display: flex; justify-content: center; gap: 1.75rem; margin-bottom: 1.1rem; }
.fw-stat-val { font-family: 'DM Mono', monospace; font-size: .95rem; color: var(--gold); display: block; }
.fw-stat-lbl { font-size: .65rem; color: rgba(245,240,232,.4); text-transform: uppercase; letter-spacing: .1em; }
.fw-btn {
  width: 100%; padding: .65rem;
  background: rgba(200,150,62,.12); border: 1px solid rgba(200,150,62,.4);
  color: var(--gold); border-radius: 50px;
  font-family: 'DM Sans', sans-serif; font-size: .82rem; font-weight: 600;
  cursor: pointer; transition: all .2s;
}
.fw-btn:hover { background: var(--gold); color: var(--brown); }

/* Ink cards for sidebar sections */
.ink-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 20px; padding: 1.6rem;
}
.ink-card .section-eyebrow { margin-bottom: .2rem; }
.ink-card .section-title { margin-bottom: 0; }

/* Leaderboard */
.lb-list { display: flex; flex-direction: column; gap: .55rem; margin-top: 1rem; }
.lb-row {
  display: flex; align-items: center; gap: .75rem;
  padding: .7rem .9rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; transition: border-color .2s, transform .2s;
}
.lb-row:hover { border-color: var(--border-bright); transform: translateX(3px); }
.lb-rank { font-family: 'DM Mono', monospace; font-size: .78rem; color: var(--muted); min-width: 20px; text-align: center; }
.lb-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--warm2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: .65rem; font-weight: 700; color: var(--gold);
  text-transform: uppercase; flex-shrink: 0;
}
.lb-name { flex: 1; font-size: .82rem; color: var(--brown); font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.lb-score { font-family: 'DM Mono', monospace; font-size: .8rem; color: var(--gold); flex-shrink: 0; }

/* New Voices */
.nv-list { display: flex; flex-direction: column; gap: .6rem; margin-top: 1rem; }
.nv-item {
  display: flex; align-items: center; gap: .75rem;
  padding: .65rem .85rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px;
}
.nv-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; font-weight: 700; color: var(--white);
  flex-shrink: 0; font-family: 'Playfair Display', serif;
}
.nv-info { flex: 1; min-width: 0; }
.nv-name { font-size: .82rem; color: var(--brown); font-weight: 600; }
.nv-type { font-size: .68rem; color: var(--muted); }
.nv-follow {
  font-size: .7rem; color: var(--gold);
  background: rgba(200,150,62,.08); border: 1px solid var(--border-bright);
  padding: .28rem .7rem; border-radius: 50px;
  cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 600;
  transition: all .2s; flex-shrink: 0;
}
.nv-follow:hover { background: var(--gold); color: var(--white); }

/* ── QUOTE BANNER ───────────────────────────────────────────── */
.quote-banner {
  background: var(--warm); border: 1px solid var(--border);
  border-radius: 20px; padding: 3rem 3.5rem;
  text-align: center; margin-bottom: 3.5rem;
  position: relative; overflow: hidden;
}
.quote-banner::before {
  content: '\201C';
  position: absolute; top: -20px; left: 20px;
  font-family: 'Playfair Display', serif;
  font-size: 8rem; color: rgba(200,150,62,.08);
  line-height: 1; font-weight: 900;
}
.quote-banner blockquote {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1rem, 2vw, 1.25rem); font-style: italic;
  color: var(--brown); line-height: 1.7; position: relative; z-index: 1;

<script>
let currentUser = null;
let currentCreator = null;

async function waitForSupabase(tries = 0) {
  if (window._sb) { init(); return; }
  if (tries > 20) { showNotFound(); return; }
  setTimeout(() => waitForSupabase(tries + 1), 250);
}
waitForSupabase();

async function init() {
  const { data: { user } } = await window._sb.auth.getUser();
  currentUser = user;

  const params = new URLSearchParams(window.location.search);
  const creatorId = params.get('id');
  if (!creatorId) { showNotFound(); return; }

  try {
    const { data: creator, error } = await window._sb
      .from('inkwell_creators')
      .select('*')
      .eq('id', creatorId)
      .single();
    if (error || !creator) { showNotFound(); return; }
    currentCreator = creator;
    renderProfile(creator);
    await Promise.all([
      loadFollowerCount(creatorId),
      loadFollowState(creatorId),
      loadBooks(creatorId),
      loadBlogs(creatorId),
    ]);
  } catch (e) {
    console.error('Failed to load profile:', e);
    showNotFound();
  }
}

function showNotFound() {
  document.getElementById('profile-loading').style.display = 'none';
  document.getElementById('profile-not-found').style.display = 'block';
}

function renderProfile(c) {
  document.title = `${c.display_name || 'Writer'} — MindStark Inkwell`;
  document.getElementById('profile-loading').style.display = 'none';
  document.getElementById('profile-content').style.display = 'block';

  document.getElementById('profile-avatar').textContent = (c.display_name || '?')[0].toUpperCase();
  document.getElementById('profile-name').textContent = c.display_name || 'Unknown Writer';
  document.getElementById('profile-id').textContent = c.mindstark_id ? `ID: ${c.mindstark_id}` : '';
  document.getElementById('profile-bio').textContent = c.bio || 'This writer hasn\'t added a bio yet.';

  if (c.creator_type) {
    const typeLabel = c.creator_type === 'both' ? 'Novelist & Blogger' : c.creator_type.charAt(0).toUpperCase() + c.creator_type.slice(1);
    const el = document.getElementById('profile-type');
    el.textContent = typeLabel;
    el.style.display = 'inline-block';
  }

  const tags = [...(c.genres || []), ...(c.blog_topics || [])];
  document.getElementById('profile-tags').innerHTML = tags.map(t => `<span class="profile-tag">${t}</span>`).join('');
}

async function loadFollowerCount(creatorId) {
  const { count } = await window._sb.from('inkwell_follows')
    .select('id', { count: 'exact', head: true }).eq('creator_id', creatorId);
  document.getElementById('stat-followers').textContent = count || 0;
}

let isFollowing = false;
async function loadFollowState(creatorId) {
  const btn = document.getElementById('follow-btn');
  if (!currentUser) {
    btn.textContent = 'Sign in to Follow';
    btn.addEventListener('click', () => window.location.href = 'signin.html');
    return;
  }
  if (currentUser.id === currentCreator.user_id) {
    btn.style.display = 'none'; // can't follow yourself
    return;
  }
  const { data } = await window._sb.from('inkwell_follows')
    .select('id').eq('follower_id', currentUser.id).eq('creator_id', creatorId).single();
  isFollowing = !!data;
  setFollowBtn();
  btn.addEventListener('click', toggleFollow);
}

function setFollowBtn() {
  const btn = document.getElementById('follow-btn');
  btn.textContent = isFollowing ? '✓ Following' : '+ Follow';
  btn.classList.toggle('following', isFollowing);
}

async function toggleFollow() {
  const btn = document.getElementById('follow-btn');
  btn.disabled = true;
  try {
    if (isFollowing) {
      await window._sb.from('inkwell_follows').delete()
        .eq('follower_id', currentUser.id).eq('creator_id', currentCreator.id);
      isFollowing = false;
    } else {
      await window._sb.from('inkwell_follows').insert({
        follower_id: currentUser.id, creator_id: currentCreator.id
      });
      isFollowing = true;
    }
    setFollowBtn();
    loadFollowerCount(currentCreator.id);
  } catch (e) {
    console.error('Follow toggle failed:', e);
  }
  btn.disabled = false;
}

async function loadBooks(creatorId) {
  const { data } = await window._sb.from('inkwell_books')
    .select('id,title,genre,cover_url,total_reads')
    .eq('creator_id', creatorId).eq('status', 'published')
    .order('published_at', { ascending: false });

  const container = document.getElementById('profile-books');
  if (!data?.length) {
    container.innerHTML = '<div class="profile-empty">No published books yet.</div>';
    updateWorksCount();
    return;
  }
  container.innerHTML = data.map(b => `
    <div class="profile-book-card" onclick="window.location.href='story.html?id=${b.id}'">
      <div class="profile-book-cover">
        ${b.cover_url ? `<img src="${b.cover_url}" alt="${b.title}"/>` : `<div class="profile-book-cover-fallback">${b.title}</div>`}
      </div>
      <div class="profile-book-title">${b.title}</div>
      <div class="profile-book-meta">${b.genre || ''} · ${formatNum(b.total_reads || 0)} reads</div>
    </div>
  `).join('');
  window._bookCount = data.length;
  updateWorksCount();
  window._readTotal = (window._readTotal || 0) + data.reduce((s, b) => s + (b.total_reads || 0), 0);
  document.getElementById('stat-reads').textContent = formatNum(window._readTotal);
}

async function loadBlogs(creatorId) {
  const { data } = await window._sb.from('inkwell_blogs')
    .select('id,title,topic,published_at,total_reads')
    .eq('creator_id', creatorId).eq('status', 'published')
    .order('published_at', { ascending: false });

  const container = document.getElementById('profile-blogs');
  if (!data?.length) {
    container.innerHTML = '<div class="profile-empty">No blog posts yet.</div>';
    window._blogCount = 0;
    updateWorksCount();
    return;
  }
  container.innerHTML = data.map(b => `
    <div class="profile-blog-item">
      <div>
        <div class="profile-blog-title">${b.title}</div>
        <div class="profile-blog-meta">${b.topic || ''} · ${timeAgo(b.published_at)}</div>
      </div>
      <div class="profile-blog-meta">${formatNum(b.total_reads || 0)} reads</div>
    </div>
  `).join('');
  window._blogCount = data.length;
  updateWorksCount();
  window._readTotal = (window._readTotal || 0) + data.reduce((s, b) => s + (b.total_reads || 0), 0);
  document.getElementById('stat-reads').textContent = formatNum(window._readTotal);
}

function updateWorksCount() {
  const total = (window._bookCount || 0) + (window._blogCount || 0);
  document.getElementById('stat-works').textContent = total;
}

function formatNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return String(n);
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const days = Math.floor(diff / 86400000);
  if (days < 1) return 'Today';
  if (days === 1) return '1 day ago';
  if (days < 30) return `${days} days ago`;
  const months = Math.floor(days / 30);
  if (months < 12) return `${months} mo ago`;
  return `${Math.floor(months / 12)} yr ago`;
}

const savedTheme = localStorage.getItem('ms-theme');
if (savedTheme === 'dark') document.body.classList.add('dark-mode');
document.getElementById('dark-toggle').addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('ms-theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
});
